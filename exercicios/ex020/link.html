<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        
        }
        a{
            color: red;
            text-decoration: none;
            font-weight: bold;

        }
        a:visited{
            color: darkred;
        }
        a:hover{
            color: black;
            text-decoration: underline;
        }
        a:active{
            color: yellow;
        }
        .especial{
            background-color: rgba(148, 42, 42, 0.418);
        }
        .especial::before{
            content: '⤷';
        }
        .especial::after{
            content: ' ⤶ ';
        }
    </style>
</head>
<body>
    <h1>personalizando Links</h1>
    <ul>
        <li><a href="https://github.com/lucasdpl1" target="_blank">Repositório Github</a></li>
        <li><a href="https://www.youtube.com/@LucasDpl" class="especial">Canal YouTube</a></li>
        <li><a href="https://www.instagram.com/lucas_.dpl/" class="especial">Instagram</a></li>
    </ul>
</body>
</html>
