<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixa</title>
    <style>
        h1{ /* box-level*/
            background-color: lightslategray;
            
            height: 300px;
            width: 300px;


            border: 10px solid darkslategray;


            padding: 10px ;

            margin: 20px auto 40px auto;

            outline: 5px dashed salmon;
        }
        a{ /* Inline-level*/
            
            border: 10px solid red;

            padding: 10px;

        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>parágrafo ta,be, são exemplos de box-levwl, mas os <a href="#">links são exmplos de caixa inline-level</a>vamos ver como tudo isso funciona.</p>
</body>
</html>
